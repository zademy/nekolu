services:
  nekolu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nekolu
    ports:
      - "8080:8080"
    environment:
      # Telegram API credentials (required — get them from https://my.telegram.org)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env or environment}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env or environment}
      # Optional: numeric user ID (auto-resolved via GetMe if unset)
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-0}
      # Upload staging directory (inside the container)
      # nekolu.upload-staging-directory: /app/tdlib/upload-staging
    volumes:
      # TDLib session + database persists across restarts
      - tdlib-data:/app/tdlib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tdlib-data:
    driver: local
